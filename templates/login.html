{% extends "forms.html" %}
{% set title = "Sign in" %}{% set button = "Sign in" %}
{% block fields %}<label>Username or email<input name="username" required autofocus></label><label>Password<span class="password-field"><input id="login-password" type="password" name="password" required><button class="password-toggle" type="button" aria-controls="login-password" aria-pressed="false">Show</button></span></label>{% endblock %}
{% block links %}<a href="{{ url_for('register') }}">Create account</a><a href="{{ url_for('reset') }}">Reset password</a>{% endblock %}
{% block scripts %}<script>
	const passwordInput = document.querySelector('#login-password');
	const passwordToggle = document.querySelector('.password-toggle');

	passwordToggle.addEventListener('click', () => {
		const isVisible = passwordInput.type === 'text';
		passwordInput.type = isVisible ? 'password' : 'text';
		passwordToggle.textContent = isVisible ? 'Show' : 'Hide';
		passwordToggle.setAttribute('aria-pressed', String(!isVisible));
	});
</script>{% endblock %}
