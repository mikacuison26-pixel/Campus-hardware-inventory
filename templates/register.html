{% extends "forms.html" %}

{% set title = "Create account" %}
{% set button = "Send Verification Code" %}

{% block fields %}

<label>
	Username
	<input name="username" required>
</label>

<label>
	Email
	<input type="email" name="email" required>
</label>

<label>
	Password
	<span class="password-field">
		<input id="register-password" type="password" name="password" minlength="8" required>

		<button class="password-toggle" type="button" id="register-password-toggle" aria-controls="register-password"
			aria-pressed="false">
			Show
		</button>
	</span>
</label>

<label>
	Role
	<select name="role">
		<option value="USER">User</option>
		<option value="ADMIN">Administrator</option>
	</select>
</label>

{% endblock %}


{% block links %}
<a href="{{ url_for('login') }}">Back to sign in</a>
{% endblock %}


{% block scripts %}
<script>
	document.addEventListener("DOMContentLoaded", function () {

		const passwordInput = document.getElementById("register-password");
		const passwordToggle = document.getElementById("register-password-toggle");

		if (!passwordInput || !passwordToggle) {
			return;
		}

		passwordToggle.addEventListener("click", function () {

			if (passwordInput.type === "password") {

				passwordInput.type = "text";
				passwordToggle.textContent = "Hide";
				passwordToggle.setAttribute("aria-pressed", "true");

			} else {

				passwordInput.type = "password";
				passwordToggle.textContent = "Show";
				passwordToggle.setAttribute("aria-pressed", "false");

			}

		});

	});
</script>
{% endblock %}
